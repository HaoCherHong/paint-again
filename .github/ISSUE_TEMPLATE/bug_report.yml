name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select the Brush tool
        2. Drag on the canvas while holding Shift
        3. …
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Paint Again → About Paint Again, or the commit you built.
      placeholder: "1.0 (1)"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you get the app?
      options:
        - Mac App Store
        - GitHub Releases
        - Built from source
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recording
      description: Drag files here. A screen recording helps a lot with mouse and cursor problems.
