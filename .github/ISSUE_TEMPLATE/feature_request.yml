name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Paint Again stays simple and fully offline: AI / generative features, accounts and cloud sync are out of scope. See [Product scope](https://github.com/HaoCherHong/paint-again/blob/main/CONTRIBUTING.md#product-scope).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: How another app handles it is useful context.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
